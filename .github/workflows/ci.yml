name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # publish.yml runs these same checks as its release gate.
  workflow_call:
    inputs:
      os:
        description: JSON array of runner labels
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    # The package is plain TypeScript with no native code: one tarball serves
    # every platform, so the matrix verifies it rather than building per OS.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # tests/issue-28-archive-cas.test.ts runs the released v2.9.0 code
          # (git show v2.9.0:...) against the archive migration; a shallow
          # checkout has no tags and the test would silently skip.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check
