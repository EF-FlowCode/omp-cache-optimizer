name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"

# npm Trusted Publishing uses GitHub's short-lived OIDC identity. No npm token
# or one-time password is stored in this repository.
permissions:
  contents: read

jobs:
  # The full check suite on Linux and Windows; nothing is published unless
  # both pass. macOS runs on every push and PR instead: hosted macOS runners
  # are often unavailable, and GitHub cancels a job it cannot place.
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      os: '["ubuntu-latest", "windows-latest"]'

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      # No dependency cache in the release job (cache-poisoning hardening):
      # it installs nothing; the checks ran in the gate above.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm Trusted Publishing requires npm 11.5.1 or newer.
      - name: Install npm trusted-publishing client
        run: npm install --global npm@11.5.1

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"

      # Release notes are this version's CHANGELOG.md section; a missing or
      # empty section fails here, before anything is published.
      - name: Extract release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"

      # Configure this repository and workflow as a Trusted Publisher for the
      # npm package before pushing a release tag.
      - name: Publish to npm with OIDC
        run: npm publish --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "$GITHUB_REF_NAME"
