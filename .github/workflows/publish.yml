name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"

# npm Trusted Publishing uses GitHub's short-lived OIDC identity. No npm token
# or one-time password is stored in this repository.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm

      # npm Trusted Publishing requires npm 11.5.1 or newer.
      - name: Install npm trusted-publishing client
        run: npm install --global npm@11.5.1

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      # Configure this repository and workflow as a Trusted Publisher for the
      # npm package before pushing a release tag.
      - name: Publish to npm with OIDC
        run: npm publish --provenance

      # Release notes come from the annotated tag message.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
